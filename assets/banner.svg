<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateY(420px); opacity: 0.2; }
    }
    @keyframes rotateReticle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .float1 { animation: floatCard1 5s ease-in-out infinite; }
    .float2 { animation: floatCard2 6s ease-in-out infinite; }
    .scanner { animation: scanline 7s linear infinite; }
    .reticle { animation: rotateReticle 24s linear infinite; transform-origin: 1040px 140px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Strictly in Background) -->
  <g filter="url(#glow)">
    <circle class="orb1" cx="220" cy="120" r="140" fill="#7c3aed" />
    <circle class="orb2" cx="1020" cy="300" r="160" fill="#0891b2" />
    <circle class="orb1" cx="800" cy="90" r="90" fill="#db2777" />
  </g>

  <!-- Subtle Perspective Camera Grid Horizon -->
  <path d="M 0 340 L 480 240 M 1200 340 L 720 240 M 480 240 L 720 240 M 360 420 L 520 240 M 840 420 L 680 240" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />

  <!-- Camera Reticle / Viewfinder Indicator (Right Side Decoration) -->
  <g class="reticle" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" fill="none">
    <circle cx="1040" cy="140" r="54" stroke-dasharray="8 6" />
    <circle cx="1040" cy="140" r="28" stroke="rgba(6, 182, 212, 0.5)" />
    <line x1="1040" y1="76" x2="1040" y2="92" />
    <line x1="1040" y1="188" x2="1040" y2="204" />
    <line x1="976" y1="140" x2="992" y2="140" />
    <line x1="1088" y1="140" x2="1104" y2="140" />
  </g>

  <!-- Dynamic Floating Decorative Cards (Subtle, Behind Core Text) -->
  <g class="float1" opacity="0.85">
    <rect x="940" y="240" width="200" height="95" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="965" cy="265" r="7" fill="#10b981" />
    <text x="982" y="270" class="title-text" font-size="12" fill="#e2e8f0" letter-spacing="0.5">CYCLES &amp; EEVEE</text>
    <text x="965" y="295" class="body-text" font-size="11" fill="#94a3b8">Physical f-stop &amp; Bokeh</text>
    <text x="965" y="315" class="body-text" font-size="11" fill="#64748b">Sensor DOF Simulation</text>
  </g>

  <g class="float2" opacity="0.85">
    <rect x="760" y="45" width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="785" cy="70" r="7" fill="#06b6d4" />
    <text x="802" y="75" class="title-text" font-size="12" fill="#e2e8f0" letter-spacing="0.5">3D GAUSSIAN SPLATS</text>
    <text x="785" y="100" class="body-text" font-size="11" fill="#94a3b8">Real-time Scene Capture</text>
    <text x="785" y="118" class="body-text" font-size="11" fill="#64748b">Photorealistic Synthesis</text>
  </g>

  <!-- High-Contrast Foreground Content Area -->
  <g id="foreground-content" transform="translate(80, 0)">
    
    <!-- Top Category Pill -->
    <g transform="translate(0, 75)">
      <rect width="365" height="32" rx="16" fill="rgba(139, 92, 246, 0.18)" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1" />
      <circle cx="16" cy="16" r="4.5" fill="#a855f7" />
      <text x="30" y="21" class="title-text" font-size="12.5" fill="#c084fc" letter-spacing="1.2">CURATED ECOSYSTEM &amp; BENCHMARK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title-text" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      3D Scene Design &amp;
    </text>
    <text x="0" y="222" class="title-text" font-size="44" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Virtual Photography 📸
    </text>

    <!-- Tagline & Description -->
    <text x="0" y="268" class="body-text" font-size="17" fill="#cbd5e1" font-weight="500">
      The definitive directory of commercial staging suites, open-source ray tracers,
    </text>
    <text x="0" y="294" class="body-text" font-size="17" fill="#94a3b8">
      in-game camera mods, real-time neural renderers, and USD production pipelines.
    </text>

    <!-- Bottom Metric Pills -->
    <g transform="translate(0, 335)">
      <!-- Pill 1 -->
      <g>
        <rect width="180" height="36" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="23" class="body-text" font-size="13" fill="#e2e8f0">🎬 <tspan font-weight="700" fill="#ffffff">Camera Simulation</tspan></text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="175" height="36" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="23" class="body-text" font-size="13" fill="#e2e8f0">⚡ <tspan font-weight="700" fill="#ffffff">GPU Ray Tracing</tspan></text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="180" height="36" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="14" y="23" class="body-text" font-size="13" fill="#e2e8f0">🌐 <tspan font-weight="700" fill="#ffffff">USD &amp; Photo Mode</tspan></text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
</svg>
